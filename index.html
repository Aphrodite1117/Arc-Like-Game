<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arc-Like-Game - Battle Screen Prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage-wrap">
    <canvas id="battle" width="600" height="600" aria-label="障害物のない16×16マスの戦闘マップ"></canvas>
    <div id="introBanner" class="intro-banner" aria-live="polite" hidden></div>
    <div id="levelUpBanner" class="level-up-banner" aria-live="polite" hidden>
      <strong id="levelUpTitle">レベルアップ！</strong>
      <div id="levelUpMessage"></div>
      <span id="levelUpPrompt"></span>
    </div>
    <div class="battle-ui">
      <div class="turn-row">
        <div id="turnLabel">Round 1</div>
        <div id="phaseLabel">味方のターン</div>
      </div>
      <div class="action-bar">
        <button id="attackBtn" type="button">攻撃</button>
        <button id="itemBtn" type="button">アイテム(3)</button>
        <button id="waitBtn" type="button">待機</button>
      </div>
      <div id="messageBox">味方のターン</div>
    </div>
    <div class="help">移動範囲内のマスをタップして位置を調整。攻撃対象・アイテム対象の選択または待機で行動を確定します</div>
    <section id="resultScreen" class="result-screen" role="dialog" aria-modal="true" aria-labelledby="resultTitle" hidden>
      <div class="result-panel">
        <h1 id="resultTitle"></h1>
        <h2>味方の獲得経験値</h2>
        <div class="result-table-wrap">
          <table>
            <thead>
              <tr><th>キャラクター</th><th>獲得EXP</th><th>レベルアップ</th><th>現在レベル</th></tr>
            </thead>
            <tbody id="resultRows"></tbody>
          </table>
        </div>
        <p id="resultGold"></p>
        <button id="replayBtn" type="button">もう一度戦う</button>
      </div>
    </section>
  </main>
  <script src="main.js"></script>
</body>
</html>
