<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <title>Arc-Like-Game | Battle Prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="top-bar">
      <div>
        <p class="eyebrow">TACTICAL RPG PROTOTYPE</p>
        <h1>試作戦闘</h1>
      </div>
      <button id="resetButton" class="small-button" type="button">リセット</button>
    </header>

    <section class="turn-panel panel" aria-label="行動順">
      <div class="section-heading">
        <h2>行動順</h2>
        <span class="subtle">AGI順・試作表示</span>
      </div>
      <div id="turnOrder" class="turn-order"></div>
    </section>

    <section class="battle-panel panel">
      <div class="battle-heading">
        <div>
          <h2>草原の訓練場</h2>
          <p>味方 3 / 敵 3</p>
        </div>
        <span class="round-badge">ROUND 01</span>
      </div>
      <div class="canvas-wrap">
        <canvas id="battleCanvas" aria-label="戦闘マップ。キャラクターを選択できます。"></canvas>
      </div>
      <p class="map-help">キャラクターをタップして選択</p>
    </section>

    <section class="status-panel panel" aria-live="polite">
      <div class="section-heading">
        <h2>キャラクター情報</h2>
        <span id="sideLabel" class="side-label ally">味方</span>
      </div>
      <div class="character-summary">
        <div id="portrait" class="portrait" aria-hidden="true">剣</div>
        <div class="character-main">
          <h3 id="characterName">アレン</h3>
          <p id="characterRole">前衛 / バランス型</p>
          <div class="hp-track"><div id="hpBar" class="hp-fill"></div></div>
          <p id="hpText" class="hp-text">HP 30 / 30</p>
        </div>
      </div>
      <div class="stat-grid">
        <div><span>攻撃</span><strong id="attackStat">10</strong></div>
        <div><span>防御</span><strong id="defenseStat">3</strong></div>
        <div><span>敏捷</span><strong id="agilityStat">12</strong></div>
        <div><span>移動</span><strong id="moveStat">3</strong></div>
      </div>
    </section>

    <section class="log-panel panel">
      <div class="section-heading">
        <h2>戦闘ログ</h2>
        <span class="subtle">SYSTEM</span>
      </div>
      <p id="battleLog">訓練場に味方と敵が現れた。</p>
    </section>

    <footer class="footer-note">PROTOTYPE 0.1 · 操作と画面レイアウトの確認用</footer>
  </main>
  <script src="main.js"></script>
</body>
</html>
